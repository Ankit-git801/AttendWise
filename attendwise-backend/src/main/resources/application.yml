spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/attendwise}
      auto-index-creation: true
  application:
    name: attendwise-backend

jwt:
  secret: ${JWT_SECRET:your-very-long-and-secure-jwt-secret-key-placeholder}
  expiration: ${JWT_EXPIRATION:315360000000} # 10 years in milliseconds

server:
  port: ${PORT:8080}
